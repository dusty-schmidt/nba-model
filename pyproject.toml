[project]
name = "nba-model"
version = "0.0.0"  # not used: the version comes from git, `lab version -C .`
description = "NBA player stat projections for props betting and fantasy"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28"]
ingest = [
    "playwright>=1.64.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
